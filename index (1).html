document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ght:700;letter-spacing:0.14em;text-transform:uppercase;color:#FDF4DC;opacity:0.85\">{{ todayLabel }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ MONTH ============ -->\n  <sc-if value=\"{{ isMonth }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:20px\">\n\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px\">\n      <button sc-camel-on-click=\"{{ prevMonth }}\" style=\"width:56px;height:56px;border-radius:50px;border:1px solid rgba(122,88,32,0.35);background:#FFFFFF;color:#7A5820;font-size:24px;line-height:1;box-shadow:0 2px 8px rgba(28,10,10,0.08)\">‹<\u002Fbutton>\n      <div style=\"flex:1;text-align:center;font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:600;color:#1C0A0A\">{{ monthLabel }}<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ nextMonth }}\" style=\"width:56px;height:56px;border-radius:50px;border:1px solid rgba(122,88,32,0.35);background:#FFFFFF;color:#7A5820;font-size:24px;line-height:1;box-shadow:0 2px 8px rgba(28,10,10,0.08)\">›<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;justify-content:center;margin-bottom:16px\">\n      <button sc-camel-on-click=\"{{ goToday }}\" style=\"height:44px;padding:0 32px;border-radius:50px;border:1px solid rgba(122,88,32,0.6);background:transparent;color:#7A5820;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap\">Jump to today<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px\">\n      <div style=\"text-align:center;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Sun<\u002Fdiv>\n      <div style=\"text-align:center;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Mon<\u002Fdiv>\n      <div style=\"text-align:center;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Tue<\u002Fdiv>\n      <div style=\"text-align:center;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Wed<\u002Fdiv>\n      <div style=\"text-align:center;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Thu<\u002Fdiv>\n      <div style=\"text-align:center;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Fri<\u002Fdiv>\n      <div style=\"text-align:center;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Sat<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ weeks }}\" as=\"week\" hint-placeholder-count=\"5\">\n      <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px\">\n        <sc-for list=\"{{ week.days }}\" as=\"day\" hint-placeholder-count=\"7\">\n          <div sc-camel-on-click=\"{{ day.onAdd }}\" style=\"min-height:132px;background:#FFFFFF;border-radius:12px;padding:8px;box-shadow:0 2px 8px rgba(28,10,10,0.08);display:flex;flex-direction:column;gap:6px;cursor:pointer\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between\">\n              <sc-if value=\"{{ day.isToday }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:30px;height:30px;border-radius:50px;background:#C9962A;color:#FDF4DC;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center\">{{ day.num }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ day.notToday }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"width:30px;height:30px;color:#7A5820;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center\">{{ day.num }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-for list=\"{{ day.appts }}\" as=\"ap\" hint-placeholder-count=\"0\">\n              <button sc-camel-on- formTitle }}<\u002Fdiv>\n\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Name<\u002Fspan>\n        <input value=\"{{ draft.name }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"First and last name\" style=\"height:52px;border:1px solid rgba(122,88,32,0.35);border-radius:4px;padding:0 14px;font-size:18px;background:#FFFFFF;color:#362408\">\n      <\u002Flabel>\n\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Phone<\u002Fspan>\n        <input value=\"{{ draft.phone }}\" sc-camel-on-change=\"{{ setPhone }}\" placeholder=\"850-555-0100\" style=\"height:52px;border:1px solid rgba(122,88,32,0.35);border-radius:4px;padding:0 14px;font-size:18px;background:#FFFFFF;color:#362408\">\n      <\u002Flabel>\n\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Address<\u002Fspan>\n        <input value=\"{{ draft.address }}\" sc-camel-on-change=\"{{ setAddress }}\" placeholder=\"Street, city, state, zip\" style=\"height:52px;border:1px solid rgba(122,88,32,0.35);border-radius:4px;padding:0 14px;font-size:18px;background:#FFFFFF;color:#362408\">\n      <\u002Flabel>\n\n      <div style=\"background:#FBF1D6;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Round trip miles<\u002Fdiv>\n        <a href=\"{{ draftMapUrl }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ openMap }}\" style=\"display:block;text-decoration:none;text-align:center;height:52px;line-height:52px;border-radius:50px;background:#C9962A;color:#FDF4DC;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase\" style-hover=\"background:#A07818\">Look up the drive in maps<\u002Fa>\n        <div style=\"font-size:15px;color:#7A5820;line-height:1.5\">Only needed once per new client. Click the button above. Google Maps will open with the route from home. Type the one-way miles it shows below — the round trip is doubled for you. The app saves that number so you can easily track it in your Excel tracking doc.<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n          <input value=\"{{ draft.oneWay }}\" sc-camel-on-change=\"{{ setOneWay }}\" placeholder=\"One way\" style=\"width:130px;height:52px;border:1px solid rgba(122,88,32,0.35);border-radius:4px;padding:0 14px;font-size:18px;background:#FFFFFF;color:#362408\">\n          <span style=\"font-size:22px;color:#7A5820\">→<\u002Fspan>\n          <div style=\"white-space:nowrap\">\n            <div style=\"font-family:'Playfair Display',Georgia,serif;font-size:32px;font-weight:700;color:#39636D;line-height:1.1\">{{ draftRoundTrip }}<\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">round trip<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:14px;color:#7A5820;margin-top:4px\">Or type the round trip straight in:<\u002Fdiv>\n        <input value=\"{{ draft.miles }}\" sc-camel-on-change=\"{{ setMiles }}\" placeholder=\"e.g. 18.4\" style=\"height:52px;border:1px solid rgba(122,88,32,0.35);border-radius:4px;padding:0 14px;font-size:18px;background:#FFFFFF;color:#362408\">\n      <\u002Fdiv>\n\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Notes (optional)<\u002Fspan>\n        <textarea value=\"{{ draft.notes }}\" sc-camel-on-change=\"{{ setNotes }}\" rows=\"3\" placeholder=\"Gate code, dog, door to use…\" style=\"border:1px solid rgba(122,88,32,0.35);border-radius:4px;padding:12px 14px;font-size:17px;background:#FFFFFF;color:#362408;resize:vertical\"><\u002Ftextarea>\n      <\u002Flabel>\n\n      <button sc-camel-on-click=\"{{ saveClient }}\" style=\"height:56px;border-radius:50px;border:0;background:#C9962A;color:#FDF4DC;font-weight:700;font-size:15px;letter-spacing:0.04em;text-transform:uppercase\" style-hover=\"background:#A07818\">Save client<\u002Fbutton>\n      <sc-if value=\"{{ canDeleteClient }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ deleteClient }}\" style=\"height:52px;border-radius:50px;border:1px solid rgba(100,34,30,0.5);background:transparent;color:#64221E;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase\">{{ deleteClientLabel }}<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ APPOINTMENT FORM ============ -->\n  <sc-if value=\"{{ isApptForm }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:640px;margin:0 auto;padding:20px\">\n    <button sc-camel-on-click=\"{{ cancel }}\" style=\"height:48px;padding:0 22px;border-radius:50px;border:1px solid rgba(122,88,32,0.6);background:transparent;color:#7A5820;font-size:14px;font-weight:700;margin-bottom:20px;white-space:nowrap\">‹&nbsp; Cancel<\u002Fbutton>\n    <div style=\"background:#FFFFFF;border-radius:12px;padding:28px;box-shadow:0 2px 8px rgba(28,10,10,0.08);display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:600;color:#1C0A0A\">{{ formTitle }}<\u002Fdiv>\n\n      <div>\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820;margin-bottom:10px\">Who<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ pickList }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ p.onPick }}\" style=\"text-align:left;width:100%;min-height:56px;border-radius:12px;padding:14px 18px;font-size:18px;font-weight:600;border:2px solid {{ p.border }};background:{{ p.bg }};color:#1C0A0A\">{{ p.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Day<\u002Fspan>\n        <input type=\"date\" value=\"{{ draft.date }}\" sc-camel-on-change=\"{{ setDate }}\" min=\"2026-01-01\" max=\"2027-12-31\" style=\"height:52px;border:1px solid rgba(122,88,32,0.35);border-radius:4px;padding:0 14px;font-size:18px;background:#FFFFFF;color:#362408\">\n      <\u002Flabel>\n\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7A5820\">Time<\u002Fspan>\n        <input type=\"time\" value=\"{{ draft.time }}\" sc-camel-on-change=\"{{ setTime }}\" step=\"900\" style=\"height:52px;border:1px solid rgba(122,88,32,0.35);border-radius:4px;padding:0 14px;font-size:18px;background:#FFFFFF;color:#362408\">\n      <\u002Flabel>\n\n      <sc-if value=\"{{ apptError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"color:#64221E;font-weight:600;font-size:15px\">Pick a person, a day, and a time.<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <button sc-camel-on-click=\"{{ saveAppt }}\" style=\"height:56px;border-radius:50px;border:0;background:#C9962A;color:#FDF4DC;font-weight:700;font-size:15px;letter-spacing:0.04em;text-transform:uppercase\" style-hover=\"background:#A07818\">Save appointment<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ BOTTOM BAR ============ -->\n  <div style=\"position:fixed;left:0;right:0;bottom:0;background:#FFFFFF;border-top:1px solid rgba(122,88,32,0.25);box-shadow:0 -4px 16px rgba(28,10,10,0.08);padding:12px 16px\">\n    <div style=\"max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px\">\n      <button sc-camel-on-click=\"{{ goMonth }}\" style=\"height:56px;border-radius:50px;border:1px solid rgba(122,88,32,0.35);background:#FFFFFF;color:#7A5820;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase\">Calendar<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goClients }}\" style=\"height:56px;border-radius:50px;border:1px solid rgba(122,88,32,0.35);background:#FFFFFF;color:#7A5820;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase\">Clients<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ newAppt }}\" style=\"height:56px;border-radius:50px;border:0;background:#C9962A;color:#FDF4DC;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase\" style-hover=\"background:#A07818\">+ Visit<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;appTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Schedule&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;homeAddress&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;6721 North Ave, Milton, FL 32570&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst KEY = 'ctl-schedule-v1';\nconst MIN_Y = 2026, MIN_M = 0, MAX_Y = 2027, MAX_M = 11;\nconst MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];\n\nfunction pad(n) { return String(n).padStart(2, '0'); }\nfunction iso(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }\nfunction uid() { return Math.random().toString(36).slice(2, 10); }\n\nfunction fmtTime(t) {\n  if (!t) return '';\n  const p = t.split(':'); let h = parseInt(p[0], 10); const mm = p[1] || '00';\n  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12; if (h === 0) h = 12;\n  return h + ':' + mm + ' ' + ap;\n}\nfunction fmtDate(d) {\n  if (!d) return '';\n  const p = d.split('-').map(Number);\n  const dt = new Date(p[0], p[1] - 1, p[2]);\n  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\n  return days[dt.getDay()] + ', ' + MONTHS[p[1] - 1] + ' ' + p[2] + ', ' + p[0];\n}\nfunction milesLabel(m) {\n  const n = parseFloat(m);\n  return isNaN(n) ? '—' : (Math.round(n * 10) / 10) + ' mi';\n}\n\nconst SEED_CLIENTS = [\n  { id: 'c1', name: 'Ruth Ann Kelly', phone: '850-555-0142', address: '4310 Berryhill Rd, Milton, FL 32571', miles: '11.6', notes: 'Side door. Small dog, friendly.' },\n  { id: 'c2', name: 'Harold Pierce', phone: '850-555-0177', address: '2209 Dogwood Dr, Pace, FL 32571', miles: '17.2', notes: 'Hard of hearing — knock loud.' },\n  { id: 'c3', name: 'Betty Nguyen', phone: '850-555-0119', address: '1500 Airport Blvd, Pensacola, FL 32504', miles: '46.8', notes: '' }\n];\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const now = new Date();\n    let y = now.getFullYear(), m = now.getMonth();\n    if (y < MIN_Y || (y === MIN_Y && m < MIN_M)) { y = MIN_Y; m = MIN_M; }\n    if (y > MAX_Y || (y === MAX_Y && m > MAX_M)) { y = MAX_Y; m = MAX_M; }\n    let saved = null;\n    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }\n    this.state = {\n      clients: saved && saved.clients ? saved.clients : SEED_CLIENTS,\n      appts: saved && saved.appts ? saved.appts : [\n        { id: 'a1', clientId: 'c1', date: iso(now.getFullYear(), now.getMonth(), Math.min(now.getDate(), 27)), time: '09:00' },\n        { id: 'a2', clientId: 'c2', date: iso(now.getFullYear(), now.getMonth(), Math.min(now.getDate() + 1, 28)), time: '13:30' }\n      ],\n      view: 'month', y: y, m: m, curId: null, draft: {}, confirm: false, confirmClient: false, apptError: false\n    };\n  }\n\n  save(patch) {\n    this.setState(patch, () => {\n      try { localStorage.setItem(KEY, JSON.stringify({ clients: this.state.clients, appts: this.state.appts })); } catch (e) {}\n    });\n  }\n\n  home() { return this.props.homeAddress || '6721 North Ave, Milton, FL 32570'; }\n  mapUrl(addr) {\n    return 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(this.home()) + '&destination=' + encodeURIComponent(addr || '');\n  }\n  openMapFor(addr) {\n    const url = this.mapUrl(addr);\n    return (e) => {\n      let w = null;\n      try { w = window.open(url, '_blank', 'noopener'); } catch (err) { w = null; }\n      if (!w) { try { window.top.location.href = url; } catch (err2) { window.location.href = url; } }\n      if (e && e.preventDefault) e.preventDefault();\n    };\n  }\n  client(id) { return this.state.clients.find(c => c.id === id) || null; }\n\n  shiftMonth(delta) {\n    let y = this.state.y, m = this.state.m + delta;\n    if (m < 0) { m = 11; y--; }\n    if (m > 11) { m = 0; y++; }\n    if (y < MIN_Y || (y === MIN_Y && m < MIN_M)) return;\n    if (y > MAX_Y || (y === MAX_Y && m > MAX_M)) return;\n    this.setState({ y: y, m: m });\n  }\n\n  openAppt(id) { this.setState({ view: 'appt', curId: id, confirm: false }); }\n  openClient(id) { this.setState({ view: 'client', curId: id }); }\n\n  startAppt(date, clientId) {\n    const now = new Date();\n    this.setState({\n      view: 'apptForm', curId: null, apptError: false,\n      draft: { clientId: clientId || null, date: date || iso(now.getFullYear(), now.getMonth(), now.getDate()), time: '09:00' }\n    });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const view = s.view;\n    const todayD = new Date();\n    const todayIso = iso(todayD.getFullYear(), todayD.getMonth(), todayD.getDate());\n\n    // ----- month grid -----\n    const first = new Date(s.y, s.m, 1).getDay();\n    const dim = new Date(s.y, s.m + 1, 0).getDate();\n    const cells = [];\n    for (let i = 0; i < first; i++) cells.push(null);\n    for (let d = 1; d <= dim; d++) cells.push(d);\n    while (cells.length % 7 !== 0) cells.push(null);\n\n    const weeks = [];\n    for (let w = 0; w < cells.length / 7; w++) {\n      const days = [];\n      for (let i = 0; i < 7; i++) {\n        const d = cells[w * 7 + i];\n        if (d === null) { days.push({ key: 'e' + w + i, num: '', isToday: false, notToday: false, appts: [], onAdd: () => {} }); continue; }\n        const date = iso(s.y, s.m, d);\n        const list = s.appts.filter(a => a.date === date)\n          .sort((a, b) => (a.time || '').localeCompare(b.time || ''))\n          .map(a => {\n            const c = this.client(a.clientId);\n            return {\n              key: a.id,\n              name: c ? c.name : 'Unknown',\n              time: fmtTime(a.time),\n              miles: c ? milesLabel(c.miles) : '—',\n              onOpen: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.openAppt(a.id); }\n            };\n          });\n        days.push({\n          key: date, num: String(d), isToday: date === todayIso, notToday: date !== todayIso,\n          appts: list, onAdd: () => this.startAppt(date, null)\n        });\n      }\n      weeks.push({ key: 'w' + w, days: days });\n    }\n\n    // ----- current record -----\n    let cur = {};\n    if (view === 'appt') {\n      const a = s.appts.find(x => x.id === s.curId);\n      const c = a ? this.client(a.clientId) : null;\n      if (a && c) {\n        cur = {\n          name: c.name, when: fmtDate(a.date) + ' at ' + fmtTime(a.time),\n          miles: milesLabel(c.miles), address: c.address, mapUrl: this.mapUrl(c.address), onMap: this.openMapFor(c.address),\n          phone: c.phone, telUrl: 'tel:' + String(c.phone || '').replace(/[^0-9+]/g, ''),\n          notes: c.notes, hasNotes: !!c.notes,\n          onEditTime: () => this.setState({ view: 'apptForm', apptError: false, draft: { id: a.id, clientId: a.clientId, date: a.date, time: a.time } }),\n          onDelete: () => {\n            if (!s.confirm) { this.setState({ confirm: true }); return; }\n            this.save({ appts: s.appts.filter(x => x.id !== a.id), view: 'month', confirm: false });\n          }\n        };\n      }\n    } else if (view === 'client') {\n      const c = this.client(s.curId);\n      if (c) {\n        const up = s.appts.filter(a => a.clientId === c.id).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))\n          .map(a => ({ key: a.id, when: fmtDate(a.date) + ' at ' + fmtTime(a.time), onOpen: () => this.openAppt(a.id) }));\n        cur = {\n          name: c.name, miles: milesLabel(c.miles), address: c.address, mapUrl: this.mapUrl(c.address), onMap: this.openMapFor(c.address),\n          phone: c.phone, telUrl: 'tel:' + String(c.phone || '').replace(/[^0-9+]/g, ''),\n          notes: c.notes, hasNotes: !!c.notes, upcoming: up, noUpcoming: up.length === 0,\n          onSchedule: () => this.startAppt(null, c.id),\n          onEdit: () => this.setState({ view: 'clientForm', confirmClient: false, draft: Object.assign({}, c) })\n        };\n      }\n    }\n\n    const draft = Object.assign({ name: '', phone: '', address: '', miles: '', notes: '', date: '', time: '', oneWay: '' }, s.draft);\n    const setField = (k) => (e) => this.setState({ draft: Object.assign({}, this.state.draft, { [k]: e.target.value }) });\n    const setOneWay = (e) => {\n      const v = e.target.value;\n      const n = parseFloat(v);\n      const patch = { oneWay: v };\n      if (!isNaN(n)) patch.miles = String(Math.round(n * 20) / 10);\n      this.setState({ draft: Object.assign({}, this.state.draft, patch) });\n    };\n    const ow = parseFloat(draft.oneWay);\n\n    const pickList = s.clients.map(c => ({\n      key: c.id, name: c.name,\n      border: draft.clientId === c.id ? '#C9962A' : 'rgba(122,88,32,0.35)',\n      bg: draft.clientId === c.id ? '#FBF1D6' : '#FFFFFF',\n      onPick: () => this.setState({ draft: Object.assign({}, this.state.draft, { clientId: c.id }) })\n    }));\n\n    return {\n      appTitle: this.props.appTitle || 'Schedule',\n      todayLabel: MONTHS[todayD.getMonth()].slice(0, 3) + ' ' + todayD.getDate() + ', ' + todayD.getFullYear(),\n      homeAddress: 'from ' + this.home(),\n      isMonth: view === 'month', isAppt: view === 'appt', isClients: view === 'clients',\n      isClient: view === 'client', isClientForm: view === 'clientForm', isApptForm: view === 'apptForm',\n      monthLabel: MONTHS[s.m] + ' ' + s.y,\n      weeks: weeks, cur: cur, draft: draft, pickList: pickList,\n      apptError: s.apptError,\n      deleteLabel: s.confirm ? 'Tap again to delete' : 'Delete',\n      deleteClientLabel: s.confirmClient ? 'Tap again to delete' : 'Delete this client',\n      canDeleteClient: !!s.draft.id,\n      formTitle: view === 'clientForm' ? (s.draft.id ? 'Edit client' : 'New client')\n        : (s.draft.id ? 'Change appointment' : 'New appointment'),\n      clientCards: s.clients.map(c => ({\n        key: c.id, name: c.name, address: c.address, miles: milesLabel(c.miles),\n        onOpen: () => this.openClient(c.id)\n      })),\n      prevMonth: () => this.shiftMonth(-1),\n      nextMonth: () => this.shiftMonth(1),\n      goToday: () => {\n        const n = new Date();\n        let y = n.getFullYear(), m = n.getMonth();\n        if (y < MIN_Y) { y = MIN_Y; m = MIN_M; }\n        if (y > MAX_Y) { y = MAX_Y; m = MAX_M; }\n        this.setState({ y: y, m: m, view: 'month' });\n      },\n      goMonth: () => {\n        const n = new Date();\n        let y = n.getFullYear(), m = n.getMonth();\n        if (y < MIN_Y) { y = MIN_Y; m = MIN_M; }\n        if (y > MAX_Y) { y = MAX_Y; m = MAX_M; }\n        this.setState({ view: 'month', y: y, m: m, confirm: false });\n      },\n      goClients: () => this.setState({ view: 'clients' }),\n      back: () => this.setState({ view: 'month', confirm: false }),\n      backClients: () => this.setState({ view: 'clients' }),\n      cancel: () => this.setState({ view: s.curId && (view === 'clientForm') ? 'clients' : 'month', confirmClient: false }),\n      newAppt: () => this.startAppt(null, null),\n      newClient: () => this.setState({ view: 'clientForm', confirmClient: false, draft: {} }),\n      setName: setField('name'), setPhone: setField('phone'), setAddress: setField('address'),\n      setMiles: setField('miles'), setNotes: setField('notes'), setDate: setField('date'), setTime: setField('time'),\n      setOneWay: setOneWay,\n      draftMapUrl: this.mapUrl(draft.address),\n      openMap: (e) => {\n        const url = this.mapUrl(this.state.draft.address || '');\n        let w = null;\n        try { w = window.open(url, '_blank', 'noopener'); } catch (err) { w = null; }\n        if (!w) { try { window.top.location.href = url; } catch (err2) { window.location.href = url; } }\n        if (e && e.preventDefault) e.preventDefault();\n      },\n      draftRoundTrip: isNaN(ow) ? '—' : (Math.round(ow * 20) / 10) + ' mi',\n      saveClient: () => {\n        const d = this.state.draft;\n        if (!d.name) return;\n        const rec = { id: d.id || uid(), name: d.name, phone: d.phone || '', address: d.address || '', miles: d.miles || '', notes: d.notes || '' };\n        const list = d.id ? s.clients.map(c => c.id === d.id ? rec : c) : s.clients.concat([rec]);\n        this.save({ clients: list, view: 'client', curId: rec.id, confirmClient: false });\n      },\n      deleteClient: () => {\n        const d = this.state.draft;\n        if (!s.confirmClient) { this.setState({ confirmClient: true }); return; }\n        this.save({ clients: s.clients.filter(c => c.id !== d.id), appts: s.appts.filter(a => a.clientId !== d.id), view: 'clients', confirmClient: false });\n      },\n      saveAppt: () => {\n        const d = this.state.draft;\n        if (!d.clientId || !d.date || !d.time) { this.setState({ apptError: true }); return; }\n        const rec = { id: d.id || uid(), clientId: d.clientId, date: d.date, time: d.time };\n        const list = d.id ? s.appts.map(a => a.id === d.id ? rec : a) : s.appts.concat([rec]);\n        const p = d.date.split('-').map(Number);\n        this.save({ appts: list, view: 'appt', curId: rec.id, y: p[0], m: p[1] - 1, apptError: false });\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
